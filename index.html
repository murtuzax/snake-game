<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Snake Game</title>
    <meta name="description" content="Snake game made using JAVASCRIPT inside browser with audio and visual effects">
</head>

<body>
    <div class="main">
        <div class="section">
            <div class="information">
                <!-- <div class="info-card"> -->
                    <!-- <h3>High Score : <span class="high-score">0</span></h3> -->
                <!-- </div> -->
                <div class="info-card">
                    <h3>Score : <span class="score">0</span></h3>
                </div>
                <div class="info-card">
                    <h3>Time : <span class="time">0</span></h3>
                </div>
                <button class="bot-btn">
                    Enable Bot
                </button>
            </div>
            <div class="board"></div>
            <div class="modal">
                <div class="game-over">
                    <p>Game Over</p>
                    <button class="btn restart-btn">Restart Game</button>
                </div>
            </div>
            <div class="touch-controls">
                <button class="control-btn" id="up"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-move-up preview-icon"><path d="M8 6L12 2L16 6"/><path d="M12 2V22"/></svg></button>
                <button class="control-btn" id="left"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left preview-icon"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
                <button class="control-btn" id="right"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-move-right preview-icon"><path d="M18 8L22 12L18 16"/><path d="M2 12H22"/></svg></button>
                <button class="control-btn" id="down"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-move-down preview-icon"><path d="M8 18L12 22L16 18"/><path d="M12 2V22"/></svg></button>
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
