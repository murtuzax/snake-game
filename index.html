<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Snake Game</title>
</head>

<body>
    <div class="main">
        <div class="section">
            <div class="information">
                <div class="info-card">
                    <h3>High Score : <span class="high-score">0</span></h3>
                </div>
                <div class="info-card">
                    <h3>Score : <span class="score">0</span></h3>
                </div>
                <div class="info-card">
                    <h3>Time : <span class="time">0</span></h3>
                </div>
            </div>
            <div class="board"></div>
            <div class="modal">
                <div class="game-over">
                    <p>Game Over</p>
                    <button class="btn restart-btn">Restart Game</button>
                </div>
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
